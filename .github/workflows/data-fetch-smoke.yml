name: Data fetch smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "Makefile"
      - ".github/workflows/data-fetch-smoke.yml"

jobs:
  fetch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Skip when DATA_REPO_PAT is missing
        if: ${{ secrets.DATA_REPO_PAT == '' }}
        run: echo "DATA_REPO_PAT not configured; skipping fetch smoke test."
      - name: Fetch SAR dataset
        if: ${{ secrets.DATA_REPO_PAT != '' }}
        env:
          DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
          DATA_REPO_NAME: ipf-data
          DATASET_TAG: datasets-sar-v1
          DATA_DIR: data
        run: bash .devcontainer/scripts/fetch-input-data.sh
      - name: Verify dataset tag
        if: ${{ secrets.DATA_REPO_PAT != '' }}
        run: test -f data/.dataset_tag
